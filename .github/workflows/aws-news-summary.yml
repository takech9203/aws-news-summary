# GitHub Actions Workflow for AWS News Summary Automation
#
# This workflow runs the aws-news-summary skill daily to fetch and summarize
# the latest AWS news updates using Amazon Bedrock.
#
# Required GitHub Secrets:
# - AWS_ROLE_ARN: ARN of the IAM role to assume
# - AWS_REGION: AWS region (default: us-east-1)
# - BEDROCK_MODEL_ID: Bedrock model ID (default: global.anthropic.claude-opus-4-6-v1)
# - INFOGRAPHIC_BASE_URL: Base URL for infographic pages (e.g. https://your-user.github.io/your-repo, without trailing slash)
#
# Job layout:
# The AWS credentials are requested with role-duration-seconds: 3600, so they
# expire one hour after each job requests them. A job that keeps calling
# Bedrock past that point fails for the rest of its run. The work is therefore
# split into jobs that each request their own credentials, stop run.py after
# TIME_BUDGET_MIN minutes, and commit and push what they created. Each job
# starts from the latest branch, so it builds on the commits of the jobs before it.
#
#   generate-reports           Reports (run.py --phase reports)
#   generate-reports-backlog   Remaining reports, only when generate-reports stopped at the time budget
#   generate-infographics      Infographics (run.py --phase infographics)
#   build-pages                Builds public/ and uploads the GitHub Pages artifact
#   deploy-pages               Deploys the artifact to GitHub Pages
#
# build-pages runs even when a generation job fails or stops at the time
# budget, so the site is deployed with everything committed so far.

name: AWS News Summary

on:
  schedule:
    # Not on the hour: scheduled runs at minute 0 are often delayed under high load
    - cron: '17 21 * * *'  # Daily at 6:17 AM JST

  repository_dispatch:
    types: [generate-aws-news-summary]

  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to look back for updates (run.py --days)'
        type: number
        required: false
        default: 3

# One run at a time. A run that starts while another is in progress waits
# instead of creating the same reports in parallel, and the run in progress is
# not canceled. This also keeps the GitHub Pages deployments in order, so
# deploy-pages has no concurrency of its own. GitHub keeps at most one waiting
# run in the group: a newer one cancels the run that was waiting.
concurrency:
  group: aws-news-summary
  cancel-in-progress: false

# Required for AWS OIDC authentication and GitHub Pages deployment
permissions:
  id-token: write
  contents: write
  pull-requests: write
  pages: write

env:
  PYTHON_VERSION: "3.14"
  AWS_DEFAULT_REGION: "us-east-1"
  # Write run.py output to the log right away, so it is not lost when a step is stopped
  PYTHONUNBUFFERED: "1"
  # Scheduled and repository_dispatch runs have no inputs and use 3 days
  DAYS: ${{ inputs.days || 3 }}
  # Minutes after which run.py stops each phase. Leaves time before the
  # credentials expire (role-duration-seconds: 3600) to finish the API calls in flight
  TIME_BUDGET_MIN: "50"
  # INFOGRAPHIC_BASE_URL: GitHub Repository Variables で設定すること
  #   Settings > Secrets and variables > Actions > Variables > INFOGRAPHIC_BASE_URL
  #   例: https://your-user.github.io/your-repo (末尾スラッシュなし)

jobs:
  generate-reports:
    name: Generate reports
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      budget_reached: ${{ steps.generate.outputs.budget_reached }}

    steps:
      - name: Check inputs
        run: |
          case "${DAYS}" in
            ''|*[!0-9]*|0)
              echo "::error::days must be a positive integer (got '${DAYS}')"
              exit 1
              ;;
          esac
          echo "Looking back ${DAYS} day(s)"

      - name: Checkout the latest branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "AWS News Bot"
          git config --global user.email "aws-news-bot@users.noreply.github.com"
          echo "Working on ${GITHUB_REF_NAME}: $(git log --oneline -1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.run_id }}-reports
          role-duration-seconds: 3600

      - name: Verify AWS credentials
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::AWS authentication failed. Check the IAM role trust policy for the OIDC provider token.actions.githubusercontent.com and the repository ${GITHUB_REPOSITORY}."
            exit 1
          fi

      - name: Generate reports
        id: generate
        # Fallback in case run.py does not stop at the time budget
        timeout-minutes: 55
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          USE_BEDROCK: "1"
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ANTHROPIC_MODEL: ${{ vars.BEDROCK_MODEL_ID || 'global.anthropic.claude-opus-4-6-v1' }}
          INFOGRAPHIC_BASE_URL: ${{ vars.INFOGRAPHIC_BASE_URL }}
          DEBUG: "1"
        run: |
          rc=0
          python run.py --phase reports --days "${DAYS}" --debug --time-budget "${TIME_BUDGET_MIN}" || rc=$?
          echo "run.py exited with code ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "${rc}" -eq 3 ]; then
            echo "budget_reached=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Report generation stopped at the ${TIME_BUDGET_MIN}-minute time budget. generate-reports-backlog creates the remaining reports."
          else
            echo "budget_reached=false" >> "$GITHUB_OUTPUT"
            if [ "${rc}" -ne 0 ]; then
              echo "::warning::run.py exited with code ${rc}. Reports written before the error are committed."
            fi
          fi

      - name: Update the reports index
        if: ${{ !cancelled() }}
        run: python -c "from run import generate_reports_index; from pathlib import Path; generate_reports_index(Path('reports'))"

      - name: Commit and push reports
        if: ${{ !cancelled() }}
        env:
          COMMIT_PATHS: reports/
          COMMIT_MESSAGE: "docs(reports): add reports"
          ARTIFACT_DIR: artifacts/new_reports
        run: bash scripts/ci-commit-and-push.sh

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-news-summary-reports
          path: artifacts/new_reports/
          retention-days: 30

      - name: Job summary
        if: always()
        env:
          RC: ${{ steps.generate.outputs.rc }}
          BUDGET_REACHED: ${{ steps.generate.outputs.budget_reached }}
        run: |
          {
            echo "## Reports"
            echo ""
            echo "- Days: ${DAYS}"
            echo "- run.py exit code: ${RC:-not run}"
            echo "- Stopped at the time budget: ${BUDGET_REACHED:-false}"
            echo "- Files added or updated: $(find artifacts/new_reports -type f 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs only when generate-reports stopped at the time budget.
  # Creates the remaining reports with new credentials.
  generate-reports-backlog:
    name: Generate remaining reports
    runs-on: ubuntu-latest
    needs: generate-reports
    if: ${{ !cancelled() && needs.generate-reports.result == 'success' && needs.generate-reports.outputs.budget_reached == 'true' }}
    timeout-minutes: 70

    steps:
      - name: Checkout the latest branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "AWS News Bot"
          git config --global user.email "aws-news-bot@users.noreply.github.com"
          echo "Working on ${GITHUB_REF_NAME}: $(git log --oneline -1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.run_id }}-backlog
          role-duration-seconds: 3600

      - name: Verify AWS credentials
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::AWS authentication failed. Check the IAM role trust policy for the OIDC provider token.actions.githubusercontent.com and the repository ${GITHUB_REPOSITORY}."
            exit 1
          fi

      - name: Generate remaining reports
        id: generate
        timeout-minutes: 55
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          USE_BEDROCK: "1"
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ANTHROPIC_MODEL: ${{ vars.BEDROCK_MODEL_ID || 'global.anthropic.claude-opus-4-6-v1' }}
          INFOGRAPHIC_BASE_URL: ${{ vars.INFOGRAPHIC_BASE_URL }}
          DEBUG: "1"
        run: |
          rc=0
          python run.py --phase reports --days "${DAYS}" --debug --time-budget "${TIME_BUDGET_MIN}" || rc=$?
          echo "run.py exited with code ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "${rc}" -eq 3 ]; then
            echo "::warning::Report generation stopped at the time budget again. The next run picks up the remaining updates."
          elif [ "${rc}" -ne 0 ]; then
            echo "::warning::run.py exited with code ${rc}. Reports written before the error are committed."
          fi

      - name: Update the reports index
        if: ${{ !cancelled() }}
        run: python -c "from run import generate_reports_index; from pathlib import Path; generate_reports_index(Path('reports'))"

      - name: Commit and push reports
        if: ${{ !cancelled() }}
        env:
          COMMIT_PATHS: reports/
          COMMIT_MESSAGE: "docs(reports): add reports"
          ARTIFACT_DIR: artifacts/new_reports
        run: bash scripts/ci-commit-and-push.sh

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-news-summary-reports-backlog
          path: artifacts/new_reports/
          retention-days: 30

      - name: Job summary
        if: always()
        env:
          RC: ${{ steps.generate.outputs.rc }}
        run: |
          {
            echo "## Remaining reports"
            echo ""
            echo "- run.py exit code: ${RC:-not run}"
            echo "- Files added or updated: $(find artifacts/new_reports -type f 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs even when the report jobs fail, so that the backfill of existing
  # reports still makes progress.
  generate-infographics:
    name: Generate infographics
    runs-on: ubuntu-latest
    needs: [generate-reports, generate-reports-backlog]
    if: ${{ !cancelled() }}
    timeout-minutes: 70

    steps:
      - name: Checkout the latest branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "AWS News Bot"
          git config --global user.email "aws-news-bot@users.noreply.github.com"
          echo "Working on ${GITHUB_REF_NAME}: $(git log --oneline -1)"

      - name: List the reports added by this run
        run: |
          mkdir -p artifacts
          git diff --name-only --diff-filter=A "${GITHUB_SHA}" HEAD -- ':(glob)reports/[0-9][0-9][0-9][0-9]/*.md' > artifacts/new_reports.txt
          echo "Reports added by this run: $(wc -l < artifacts/new_reports.txt)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.run_id }}-infographics
          role-duration-seconds: 3600

      - name: Verify AWS credentials
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::AWS authentication failed. Check the IAM role trust policy for the OIDC provider token.actions.githubusercontent.com and the repository ${GITHUB_REPOSITORY}."
            exit 1
          fi

      - name: Generate infographics
        id: generate
        timeout-minutes: 55
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          USE_BEDROCK: "1"
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ANTHROPIC_MODEL: ${{ vars.BEDROCK_MODEL_ID || 'global.anthropic.claude-opus-4-6-v1' }}
          INFOGRAPHIC_BASE_URL: ${{ vars.INFOGRAPHIC_BASE_URL }}
          # New reports first, then existing reports without HTML with the rest of the cap.
          # Both are processed newest date first, as the site lists the newest articles first
          INFOGRAPHIC_MAX: "60"
          INFOGRAPHIC_BACKFILL_MAX: "60"
          DEBUG: "1"
        run: |
          rc=0
          python run.py --phase infographics --new-reports-file artifacts/new_reports.txt --debug --time-budget "${TIME_BUDGET_MIN}" || rc=$?
          echo "run.py exited with code ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "${rc}" -eq 3 ]; then
            echo "::warning::Infographic generation stopped at the ${TIME_BUDGET_MIN}-minute time budget. The next run picks up the rest as backfill."
          elif [ "${rc}" -ne 0 ]; then
            echo "::warning::run.py exited with code ${rc}."
          fi

      - name: Update the infographic index
        if: ${{ !cancelled() }}
        run: python -c "from run import generate_infographic_index; from pathlib import Path; generate_infographic_index(Path('infographic'))"

      - name: Commit and push infographics
        if: ${{ !cancelled() }}
        env:
          COMMIT_PATHS: infographic/
          COMMIT_MESSAGE: "docs(infographic): add infographics"
          ARTIFACT_DIR: artifacts/new_infographics
          ARTIFACT_FLAT: "1"
        run: bash scripts/ci-commit-and-push.sh

      - name: Upload infographic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-news-summary-infographics
          path: |
            artifacts/new_infographics/
            artifacts/new_reports.txt
          retention-days: 30

      - name: Job summary
        if: always()
        env:
          RC: ${{ steps.generate.outputs.rc }}
        run: |
          {
            echo "## Infographics"
            echo ""
            echo "- Reports added by this run: $(wc -l < artifacts/new_reports.txt 2>/dev/null || echo 0)"
            echo "- run.py exit code: ${RC:-not run}"
            echo "- Files added or updated: $(find artifacts/new_infographics -type f 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds the GitHub Pages content from the latest branch, including the
  # commits of the generation jobs, even when one of them failed or stopped
  # at the time budget.
  build-pages:
    name: Build GitHub Pages content
    runs-on: ubuntu-latest
    needs: [generate-reports, generate-reports-backlog, generate-infographics]
    if: ${{ !cancelled() }}
    timeout-minutes: 15

    steps:
      - name: Checkout the latest branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt -q

      - name: Download infographic artifacts
        uses: actions/download-artifact@v8
        with:
          name: aws-news-summary-infographics
          path: artifacts/
        continue-on-error: true

      - name: Build Pages content
        run: |
          echo "Building from ${GITHUB_REF_NAME}: $(git log --oneline -1)"
          mkdir -p public
          # Copy infographics from repo
          cp infographic/*.html public/ 2>/dev/null || true
          # Overlay any new infographics from artifacts (in case the push failed)
          cp artifacts/new_infographics/*.html public/ 2>/dev/null || true
          # Regenerate index from public/ contents
          python -c "from run import generate_infographic_index; from pathlib import Path; generate_infographic_index(Path('public'))"
          echo "Total HTML files in public/: $(find public -maxdepth 1 -name '*.html' | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Deploys in a separate job from the upload, as in the GitHub Pages starter
  # workflows. Deploying in the same job right after the upload intermittently
  # fails with 'No artifacts named "github-pages" were found'
  # (https://github.com/actions/deploy-pages/issues/451).
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-pages
    if: ${{ !cancelled() && needs.build-pages.result == 'success' }}
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
